name: Publish source release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Package allowlisted source
        shell: bash
        run: |
          stage="$(node scripts/distribution.js source)"
          archive="$GITHUB_WORKSPACE/dist/Qinghe-Guandan-AI-source.zip"
          (cd "$stage" && zip -qr "$archive" .)
      - uses: actions/upload-artifact@v4
        with:
          name: Qinghe-Guandan-AI-source
          path: dist/Qinghe-Guandan-AI-source.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Qinghe-Guandan-AI-source.zip --generate-notes --verify-tag
